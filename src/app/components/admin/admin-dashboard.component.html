<div class="admin-container">
  <div class="header">
    <h1>Inventory Control</h1>
    
    <div class="search-container" *ngIf="!showForm">
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        placeholder="🔍 Search by category..."
        class="search-input"
      />
    </div>
    <button (click)="toggleForm()" class="btn-main">
      {{ showForm ? '← Back to List' : '+ Add Product' }}
    </button>
  </div>

  <div class="form-wrapper" *ngIf="showForm">
    <div class="form-card">
      <h2>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h2>
      <form (ngSubmit)="onSubmit()" #productForm="ngForm">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" [(ngModel)]="product.name" name="name" required placeholder="Enter name">
        </div>

        <div class="form-group">
          <label>Price</label>
          <input type="number" [(ngModel)]="product.price" name="price" required placeholder="0.00">
        </div>

        <div class="form-group">
          <label>Category</label>
          <input type="text" [(ngModel)]="product.category" name="category" required placeholder="e.g. Kitchen">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea [(ngModel)]="product.description" name="description" placeholder="Briefly describe the product"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save" [disabled]="!productForm.valid">
            {{ isEditMode ? 'Update Product' : 'Save Product' }}
          </button>
          <button type="button" (click)="toggleForm()" class="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="table-wrapper" *ngIf="!showForm">
    <table *ngIf="filteredProducts.length > 0">
      <thead>
        <tr>
          <th>Name</th>
          <th>Price</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredProducts">
          <td>{{ item.name }}</td>
          <td>{{ item.price | currency }}</td>
          <td><span class="cat-tag">{{ item.category }}</span></td>
          <td>
            <button (click)="onEdit(item)" class="edit-text">Edit</button>
            <button (click)="onDelete(item._id)" class="delete-text">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="filteredProducts.length === 0" class="no-results">
      <p *ngIf="searchTerm">No products found in "{{ searchTerm }}"</p>
      <p *ngIf="!searchTerm">Your inventory is empty. Click "+ Add Product" to start.</p>
    </div>
  </div>
</div>
